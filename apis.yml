aid: openldap
name: OpenLDAP
description: >-
  OpenLDAP is an open source implementation of the Lightweight Directory
  Access Protocol (LDAP) that provides directory server daemons, client
  libraries, and utilities for managing distributed directory services.
  The suite includes slapd (the standalone LDAP daemon), lloadd (a load
  balancer), protocol libraries, and command-line tools for searching,
  modifying, and administering directory data. OpenLDAP does not expose
  a REST API; access is via the LDAP protocol over TCP using SASL, simple
  bind, or TLS-secured authentication.
