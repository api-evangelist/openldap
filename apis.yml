    name: OpenLDAP Directory Service
    description: >-
      LDAP v3 protocol interface provided by the slapd directory server for
      reading, writing, and managing hierarchical directory entries.
      Authentication is via simple bind, SASL mechanisms, or TLS client
      certificates rather than a REST API.
